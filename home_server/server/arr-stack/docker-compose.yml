# OneForArr (movies, shows and indexers in one app), with qBittorrent locked
# inside a Surfshark VPN.
#
# Only qBittorrent's traffic goes through Surfshark. If the VPN drops, gluetun's
# firewall blocks qBittorrent from the internet entirely (built-in kill switch).
# The rest of the Mac — Jellyfin, Tailscale, the HDHomeRun — is unaffected.
#
# Settings come from .env (copy .env.example).

services:
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      - VPN_SERVICE_PROVIDER=surfshark
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${SURFSHARK_WG_PRIVATE_KEY}
      - WIREGUARD_ADDRESSES=${SURFSHARK_WG_ADDRESS}
      - SERVER_COUNTRIES=${VPN_COUNTRY}
      - TZ=${TZ}
    ports:
      - 8080:8080           # qBittorrent web UI (lives inside the VPN)
    volumes:
      - ./config/gluetun:/gluetun
    restart: unless-stopped

  qbittorrent:
    image: lscr.io/linuxserver/qbittorrent:latest
    container_name: qbittorrent
    network_mode: service:gluetun   # all traffic goes through the VPN, or nowhere
    depends_on:
      gluetun:
        condition: service_healthy
    environment:
      - PUID=${PUID}
      - PGID=${PGID}
      - TZ=${TZ}
      - WEBUI_PORT=8080
    volumes:
      - ./config/qbittorrent:/config
      - ${MEDIA_DIR}:/data
    restart: unless-stopped

  # Movies, shows and indexers (replaces Radarr, Sonarr and Prowlarr).
  # Built from ~/homey/oneforarr; rebuild after changes with
  #   docker compose up -d --build oneforarr
  # It runs outside the VPN: it only searches and tells qBittorrent what to
  # download. In its Settings, qBittorrent's address is http://gluetun:8080.
  oneforarr:
    build:
      context: ../../../oneforarr
      dockerfile: deploy/Dockerfile
    image: oneforarr:local
    container_name: oneforarr
    user: "${PUID}:${PGID}"       # files it creates belong to you
    ports:
      - 7979:7979
    volumes:
      - ./config/oneforarr:/config   # its data file, plus definitions/ (indexer .yml files)
      - ${MEDIA_DIR}:/data
    restart: unless-stopped
